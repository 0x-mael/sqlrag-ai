services : 
  db:
    image: postgres
    environment :
      - .env
    volumes : 
      - pgdata:/var/lib/postgresql/data
    ports : 
      - "5432:5432"
    restart: always

  app:
    build : .
    command : gradio app/ui/interface.py
    container_name : gradio_app
    restart : always
    ports :
      - "7860:7860"    


  mlflow :
    image : ghcr.io/mlflow/mlflow:latest
    container_name : mlflow_server
    ports:
      - "5000:5000"
    volumes:
      - mlruns:/mlruns
    command: > 
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlruns/mlflow.db 
    restart: always


volumes : 
  mlruns :
  pgdata :

